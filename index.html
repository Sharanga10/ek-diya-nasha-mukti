<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#081027">
<meta property="og:title" content="एक दिया नशा मुक्ति के लिए">
<meta property="og:description" content="माचिस खिसकाइए, दीये जलाइए — इस दीपावली नशा मुक्ति का दिया भी जलाइए। परामर्श 14446 · मानस 1933">
<meta property="og:type" content="website">
<title>एक दिया नशा मुक्ति के लिए</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#081027;overflow:hidden;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100dvh;touch-action:none}
  #cta{position:fixed;left:50%;bottom:5.5vh;transform:translateX(-50%);display:none;
    font-family:Khand,"Noto Sans Devanagari",sans-serif;font-weight:700;font-size:17px;color:#ffd98a;
    background:rgba(10,19,48,.72);border:1.5px solid rgba(245,192,78,.75);border-radius:999px;
    padding:12px 26px;letter-spacing:.5px;cursor:pointer;box-shadow:0 0 24px rgba(245,192,78,.28)}
  #cta:active{transform:translateX(-50%) scale(.97)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="cta">अपना दिया जलाएँ · शेयर करें</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),cta=document.getElementById('cta');
let W=0,H=0,DPR=1;
const HI='एक दिया नशा मुक्ति के लिए',WORD='शुभ दीपावली',
      FOOT='परामर्श 14446 · मानस 1933 · @CGPoliceDept';
let pts=[],p=0,maxP=0,dragging=false,complete=false,firstTouch=false,t0=performance.now();
let trackY=0,x0=0,x1=0,wordCx=0,wordCy=0,boxW=0,boxH=0;
const sparks=[];
const flameSpr=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
 const r=g.createRadialGradient(32,38,2,32,38,30);
 r.addColorStop(0,'rgba(255,252,235,1)');r.addColorStop(.22,'rgba(255,214,96,.96)');
 r.addColorStop(.5,'rgba(255,128,24,.6)');r.addColorStop(1,'rgba(255,60,0,0)');
 g.fillStyle=r;g.fillRect(0,0,64,64);
 g.fillStyle='rgba(255,244,200,.95)';g.beginPath();g.ellipse(32,36,6,12,0,0,7);g.fill();return c;})();
const bowlSpr=(()=>{const c=document.createElement('canvas');c.width=84;c.height=50;const g=c.getContext('2d');
 const lg=g.createLinearGradient(0,14,0,46);lg.addColorStop(0,'#a96026');lg.addColorStop(1,'#4e2a10');
 g.fillStyle=lg;g.beginPath();g.ellipse(42,30,34,15,0,0,Math.PI);g.fill();
 g.fillStyle='rgba(255,210,130,.55)';g.beginPath();g.ellipse(42,28,34,5,0,0,Math.PI);g.fill();
 g.strokeStyle='#2c1608';g.lineWidth=2.4;g.beginPath();g.moveTo(42,26);g.quadraticCurveTo(43,18,45,15);g.stroke();
 return c;})();
function layout(){
  boxW=Math.min(W*.88,560);boxH=boxW*.24;
  wordCx=W/2;wordCy=H*.33;trackY=H*.835;x0=W*.14;x1=W*.86;
}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();}
addEventListener('resize',resize);resize();
function sampleWord(){
  const oc=document.createElement('canvas');oc.width=1100;oc.height=280;const o=oc.getContext('2d');
  o.fillStyle='#fff';o.textAlign='center';o.textBaseline='middle';
  o.font='700 150px Khand,"Noto Sans Devanagari","Nirmala UI",sans-serif';
  o.fillText(WORD,550,140);
  const d=o.getImageData(0,0,1100,280).data,A=[],st=9;
  for(let y=0;y<280;y+=st)for(let x=0;x<1100;x+=st)
    if(d[(y*1100+x)*4+3]>150)A.push([x/1100,y/280]);
  for(let i=A.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=A[i];A[i]=A[j];A[j]=t;}
  pts=A.slice(0,84).map(([px,py])=>[wordCx+(px-.5)*boxW,wordCy+(py-.5)*boxH]);
}
function burst(x,y,n,pow){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(Math.random()*.55+.25)*pow;
  sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.4,life:1,r:Math.random()*2+1});}}
function litCount(){return Math.min(pts.length,Math.floor(p*pts.length+0.001));}
let lastLit=0;
function frame(now){
  const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1638');bg.addColorStop(1,'#050a1c');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const hs=Math.min(W*.055,23);
  ctx.font='700 '+hs+'px Khand,"Noto Sans Devanagari","Nirmala UI",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(245,192,78,.95)';ctx.shadowColor='rgba(245,192,78,.8)';ctx.shadowBlur=14;
  ctx.fillText(HI,W/2,H*.085);ctx.shadowBlur=0;
  if(complete){ctx.save();ctx.globalAlpha=.3+Math.sin(t*2)*.06;
    ctx.fillStyle='#ffd98a';ctx.shadowColor='rgba(255,180,60,.9)';ctx.shadowBlur=34;
    ctx.font='700 '+Math.min(boxW*.14,74)+'px Khand,"Noto Sans Devanagari",sans-serif';
    ctx.fillText(WORD,wordCx,wordCy);ctx.restore();}
  const n=litCount();
  for(let i=0;i<pts.length;i++){
    const[x,y]=pts[i],lit=i<n,fl=.82+Math.sin(t*7+i*1.7)*.14;
    ctx.globalAlpha=lit?1:.28;ctx.drawImage(bowlSpr,x-30,y-16,60,36);
    if(lit){ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=.85*fl;ctx.drawImage(flameSpr,x-23,y-40,46,46);
      ctx.globalAlpha=.28*fl;ctx.drawImage(flameSpr,x-40,y-58,80,80);
      ctx.globalCompositeOperation='source-over';}
    ctx.globalAlpha=1;}
  const mbW=Math.min(W*.3,150),mbH=mbW*.24,mbX=W/2-mbW/2,mbY=H*.70;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  const mg=ctx.createLinearGradient(0,mbY,0,mbY+mbH);mg.addColorStop(0,'#8a5526');mg.addColorStop(1,'#54300f');
  ctx.fillStyle=mg;rct(mbX,mbY,mbW,mbH,5);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(20,10,4,.8)';rct(mbX+mbW-14,mbY+2,9,mbH-4,2);ctx.fill();
  ctx.fillStyle='#ffd98a';ctx.font='600 '+Math.round(mbH*.5)+'px Khand,"Noto Sans Devanagari",sans-serif';
  ctx.fillText('माचिस',mbX+mbW/2-5,mbY+mbH/2+1);
  ctx.strokeStyle='rgba(245,192,78,.18)';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x0,trackY);ctx.lineTo(x1,trackY);ctx.stroke();
  ctx.strokeStyle='rgba(245,192,78,.5)';ctx.beginPath();ctx.moveTo(x0,trackY);
  ctx.lineTo(x0+(x1-x0)*p,trackY);ctx.stroke();
  const sx=x0+(x1-x0)*p;
  const sg=ctx.createLinearGradient(sx-52,0,sx,0);sg.addColorStop(0,'#8a5a2a');sg.addColorStop(1,'#d9a45e');
  ctx.fillStyle=sg;rct(sx-52,trackY-3.5,48,7,3);ctx.fill();
  ctx.fillStyle='#c22a2a';ctx.beginPath();ctx.arc(sx-2,trackY,7,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,120,120,.55)';ctx.beginPath();ctx.arc(sx-4,trackY-2,2.6,0,7);ctx.fill();
  if(p>0.02&&!complete){ctx.globalCompositeOperation='lighter';
    const fl=.85+Math.sin(t*13)*.2;ctx.globalAlpha=.95*fl;
    ctx.drawImage(flameSpr,sx-2-20,trackY-34,40,40);ctx.globalAlpha=.3*fl;
    ctx.drawImage(flameSpr,sx-2-34,trackY-48,68,68);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    if(Math.random()<.5)sparks.push({x:sx-2,y:trackY-8,vx:(Math.random()-.5)*.7,vy:-Math.random()*.9-.2,life:1,r:Math.random()*1.6+.6});}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.012;s.life-=.022;
    if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.globalAlpha=s.life;ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  if(!firstTouch&&!complete){const a=.55+Math.sin(t*3)*.3;
    ctx.globalAlpha=a;ctx.fillStyle='#ffd98a';
    ctx.font='600 '+Math.min(W*.042,17)+'px Khand,"Noto Sans Devanagari",sans-serif';
    ctx.fillText('माचिस खिसकाइए',W/2,trackY+34);
    const ax=x0+(x1-x0)*((t*.6)%1);ctx.globalAlpha=a*.8;
    ctx.beginPath();ctx.arc(ax,trackY-26,5,0,7);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle='rgba(200,210,235,.5)';
  ctx.font='500 '+Math.min(W*.033,13)+'px Khand,"Noto Sans Devanagari",sans-serif';
  ctx.fillText(FOOT,W/2,H*.965);
  if(n>lastLit){lastLit=n;try{navigator.vibrate&&navigator.vibrate(6);}catch(e){}}
  if(complete&&Math.random()<.02)burst(Math.random()*W,wordCy+(Math.random()-.5)*boxH,6,1.4);
  requestAnimationFrame(frame);
}
function rct(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function go(x){const np=Math.max(0,Math.min(1,(x-x0)/(x1-x0)));if(np>maxP)maxP=np;p=maxP;}
cv.addEventListener('pointerdown',e=>{firstTouch=true;
  if(complete)return;
  if(Math.abs(e.clientY-trackY)<80){dragging=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}go(e.clientX);}});
cv.addEventListener('pointermove',e=>{if(dragging)go(e.clientX);});
addEventListener('pointerup',()=>{dragging=false;
  if(!complete&&p>=.99){p=1;complete=true;
    burst(x1,trackY-14,26,2.2);
    const wp=pts[Math.floor(pts.length*.7)];setTimeout(()=>burst(wp[0],wp[1]-20,20,1.8),260);
    const wq=pts[Math.floor(pts.length*.3)];setTimeout(()=>burst(wq[0],wq[1]-20,20,1.8),520);
    setTimeout(()=>{cta.style.display='block';},650);}});
cv.oncontextmenu=e=>e.preventDefault();
cta.addEventListener('click',()=>{const u=location.href;
  if(navigator.share){navigator.share({title:HI,text:HI+' — '+WORD,url:u}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>{cta.textContent='लिंक कॉपी हो गया';setTimeout(()=>cta.textContent='अपना दिया जलाएँ · शेयर करें',2200);});}});
function start(){sampleWord();requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,800))]).then(start);
else start();
</script>
</body>
</html>
